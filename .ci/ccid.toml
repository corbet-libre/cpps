schema = 1
project = "cpps"

# Preserved hosted Linux gates live here;
# resolve/cargo-update excluded per prior-cohort rule;
# registry/live reads stay FRESH outside cache.
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
# 2026-11-06: no incremental compilation for this job. tests::configuration_and_upstream_sequencing calls a futures LocalPool block_on from inside another executor
# (EnterError, futures-executor 0.3.34 local_pool.rs:80); it passes only by luck without incremental, so the test needs fixing, and then this line goes.
environment = { CARGO_INCREMENTAL = "0" }
runs_on = "heavy"
events = ["push", "manual"]
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]

[jobs.verify-pr]
scheduler = "forgejo"
runs_on = "light"
events = ["pull_request"]
checks = ["verify"]
workflow = "pr"
command = ["bash", ".ci/run-cached.sh"]
